name: hayyak
description: "Hayyak - a Flutter community app for neighborhood information, local services, safe routes, and community engagement."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.2.2
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.3.0
  qr_flutter: ^4.1.0
  http: ^1.2.1
  image_picker: ^1.1.0
  url_launcher: ^6.3.0
  provider: ^6.0.5
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_database: ^12.0.0
  google_sign_in: ^6.1.6
  flutter_rating_bar: ^4.0.0
  flutter_map: ^8.2.1
  latlong2: ^0.9.0
  geolocator: ^14.0.2
  flutter_local_notifications: ^19.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_splash.png
    - assets/images/logo_square_light.png
    - assets/images/logo_square_dark.png
    - assets/images/logo_full_dark.png
    - assets/images/default_profile.png
    - assets/images/users.png
    - assets/images/location.png
    - assets/images/comments.png
    - assets/images/contact.png
    - assets/images/logo.png
    - assets/images/header.jpg
    - assets/images/amanah_logo.png
    - assets/images/home_intro.jpg
